<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <body>
      <h1>Weather at a Glance 🌤️</h1>

      <form onsubmit="checkWeather(event)">
        <input type="text" class="input" placeholder="Enter Your City" />
        <button class="button">Check Weather</button>
      </form>

      <!-- Location -->
      <p class="place"></p>
      <p class="region"></p>
      <p class="time"></p>

      <!-- Main Weather -->
      <p class="temp"></p>
      <img class="conditionIcon" />
      <p class="conditionText"></p>
      <p class="feelslike"></p>

      <!-- Weather Details -->
      <p class="humidity"></p>
      <p class="rain"></p>
      <p class="wind"></p>
      <p class="uv"></p>
      <p class="visiblity"></p>

      <!-- error -->
      <p class="empty"></p>
      <script src="https://cdn.jsdelivr.net/npm/axios@1.17.0/dist/axios.min.js"></script>
      <script src="./app.js"></script>
    </body>
  </body>
</html>
