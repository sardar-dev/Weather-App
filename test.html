<!-- Then write JavaScript so:

User types something.
You save it to localStorage.
When the page loads again, the old text appears in the input.

Hint: You'll need input.value, setItem(), and getItem(). -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form onsubmit="run(event)">
      <input class="input" type="text" />
      <button>submit</button>
    </form>

    <script>
      let input = document.querySelector(".input");

      input.value = localStorage.getItem("text") || "";

      function run(event) {
        event.preventDefault();

        localStorage.setItem("text", input.value);
      }
    </script>
  </body>
</html>
